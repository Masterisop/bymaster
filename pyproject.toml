[project]
name = "roblox-join-coordinator"
version = "0.1.0"
description = "Roblox Join Coordinator - Web dashboard to coordinate mass-join across Roblox instances"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
