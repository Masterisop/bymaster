<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Join Coordinator</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222f;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --green: #43b581;
      --red: #f04747;
      --yellow: #faa61a;
      --text: #dcddde;
      --text-muted: #72767d;
      --border: #2f3136;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #7b68ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
    }

    .status-dot.connected { background: var(--green); }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
    }

    .stats-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem 1.5rem;
      flex: 1;
    }

    .stat-card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .stat-card .value {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .stat-card .value.green { color: var(--green); }
    .stat-card .value.yellow { color: var(--yellow); }

    .join-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .join-btn {
      background: linear-gradient(135deg, #f04747, #d32f2f);
      color: #fff;
      border: none;
      padding: 1rem 3rem;
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      box-shadow: 0 4px 20px rgba(240, 71, 71, 0.3);
    }

    .join-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(240, 71, 71, 0.45);
    }

    .join-btn:active { transform: translateY(0); }

    .join-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .join-feedback {
      margin-top: 0.8rem;
      font-size: 0.9rem;
      color: var(--green);
      min-height: 1.4em;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .clients-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    .client-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
      transition: border-color 0.2s;
    }

    .client-card:hover { border-color: var(--accent); }

    .client-card .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }

    .client-card .username {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .client-card .badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.6rem;
      border-radius: 100px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge.online  { background: rgba(67,181,129,0.15); color: var(--green); }
    .badge.offline { background: rgba(240,71,71,0.15);  color: var(--red); }

    .client-card .detail {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    .client-card .detail span { color: var(--text); }

    .client-card .result-msg {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      background: var(--surface2);
    }

    .result-msg.success { border-left: 3px solid var(--green); }
    .result-msg.fail    { border-left: 3px solid var(--red); }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state p { max-width: 400px; margin: 0 auto; line-height: 1.6; }

    .script-section {
      margin-top: 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .script-section h3 {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .script-section pre {
      background: var(--bg);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      font-size: 0.82rem;
      line-height: 1.5;
      color: #b5b5c3;
    }

    .copy-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 0.6rem;
      transition: background 0.2s;
    }

    .copy-btn:hover { background: var(--accent-hover); }

    .log-section {
      margin-top: 2rem;
    }

    .log-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.82rem;
      font-family: 'Consolas', monospace;
      color: var(--text-muted);
    }

    .log-list .entry {
      padding: 0.25rem 0;
      border-bottom: 1px solid var(--border);
    }

    .log-list .entry:last-child { border-bottom: none; }
    .log-list .entry .time { color: var(--accent); margin-right: 0.5rem; }
  </style>
</head>
<body>

<div class="header">
  <h1>Roblox Join Coordinator</h1>
  <div class="status-badge">
    <div class="status-dot" id="wsDot"></div>
    <span id="wsStatus">Connecting...</span>
  </div>
</div>

<div class="container">
  <div class="stats-bar">
    <div class="stat-card">
      <div class="label">Total Connected</div>
      <div class="value" id="totalCount">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Online</div>
      <div class="value green" id="onlineCount">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Offline</div>
      <div class="value yellow" id="offlineCount">0</div>
    </div>
  </div>

  <div class="join-section">
    <button class="join-btn" id="joinBtn" onclick="sendJoin()">
      MASS JOIN
    </button>
    <div class="join-feedback" id="joinFeedback"></div>
  </div>

  <div class="section-title">Connected Instances</div>
  <div id="clientsContainer"></div>

  <div class="log-section">
    <div class="section-title">Activity Log</div>
    <div class="log-list" id="logList">
      <div class="entry"><span class="time">[--:--:--]</span> Waiting for connections...</div>
    </div>
  </div>

  <div class="script-section">
    <h3>Roblox Lua Script</h3>
    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.8rem;">
      Execute this script in your Roblox instance. Update <code>SERVER_URL</code> to your deployed backend URL.
    </p>
    <pre id="luaScript"></pre>
    <button class="copy-btn" onclick="copyScript()">Copy Script</button>
  </div>
</div>

<script>
const API_BASE = window.location.origin;
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/dashboard';

let ws;
let clients = [];
let resultMap = {};

// ── WebSocket ──────────────────────────────────────────────────────────────

function connectWS() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    document.getElementById('wsDot').classList.add('connected');
    document.getElementById('wsStatus').textContent = 'Connected';
    addLog('Dashboard connected to server');
  };

  ws.onclose = () => {
    document.getElementById('wsDot').classList.remove('connected');
    document.getElementById('wsStatus').textContent = 'Disconnected';
    addLog('Connection lost — reconnecting in 3s...');
    setTimeout(connectWS, 3000);
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'state') {
      clients = msg.clients;
      renderClients();
    }

    if (msg.type === 'join_sent') {
      const fb = document.getElementById('joinFeedback');
      fb.textContent = `Join command sent to ${msg.count} instance(s)!`;
      addLog(`JOIN command dispatched to ${msg.count} instance(s)`);
      setTimeout(() => fb.textContent = '', 4000);
    }

    if (msg.type === 'result') {
      resultMap[msg.client_id] = { success: msg.success, message: msg.message };
      addLog(`Result from ${msg.client_id}: ${msg.success ? 'SUCCESS' : 'FAIL'} — ${msg.message}`);
      renderClients();
    }
  };
}

// ── Render ──────────────────────────────────────────────────────────────────

function renderClients() {
  const container = document.getElementById('clientsContainer');
  const online = clients.filter(c => c.status === 'online');
  const offline = clients.filter(c => c.status === 'offline');

  document.getElementById('totalCount').textContent = clients.length;
  document.getElementById('onlineCount').textContent = online.length;
  document.getElementById('offlineCount').textContent = offline.length;

  if (clients.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">&#127918;</div>
        <p>No Roblox instances connected yet. Execute the Lua script in your Roblox instances to see them here.</p>
      </div>`;
    return;
  }

  container.innerHTML = `<div class="clients-grid">${clients.map(c => {
    const res = resultMap[c.client_id];
    let resultHTML = '';
    if (res) {
      resultHTML = `<div class="result-msg ${res.success ? 'success' : 'fail'}">${res.success ? 'Clicked join!' : 'Failed:'} ${res.message}</div>`;
    }
    return `
      <div class="client-card">
        <div class="top-row">
          <span class="username">${escHtml(c.username)}</span>
          <span class="badge ${c.status}">${c.status}</span>
        </div>
        <div class="detail">Game: <span>${escHtml(c.game_name)}</span></div>
        <div class="detail">ID: <span>${c.client_id}</span></div>
        <div class="detail">Last seen: <span>${c.last_seen_ago}s ago</span></div>
        ${resultHTML}
      </div>`;
  }).join('')}</div>`;
}

// ── Actions ────────────────────────────────────────────────────────────────

function sendJoin() {
  const btn = document.getElementById('joinBtn');
  btn.disabled = true;
  resultMap = {};

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ action: 'join' }));
  } else {
    fetch(API_BASE + '/api/join', { method: 'POST' })
      .then(r => r.json())
      .then(d => {
        document.getElementById('joinFeedback').textContent = `Sent to ${d.sent_to} instance(s)`;
      });
  }

  setTimeout(() => btn.disabled = false, 2000);
}

// ── Log ────────────────────────────────────────────────────────────────────

function addLog(text) {
  const list = document.getElementById('logList');
  const now = new Date().toLocaleTimeString();
  const entry = document.createElement('div');
  entry.className = 'entry';
  entry.innerHTML = `<span class="time">[${now}]</span> ${escHtml(text)}`;
  list.prepend(entry);
  if (list.children.length > 50) list.removeChild(list.lastChild);
}

// ── Lua script display ────────────────────────────────────────────────────

const LUA_SCRIPT = `-- Roblox Join Coordinator Script
-- Execute this in your Roblox instance (requires HttpService access)

local SERVER_URL = "${API_BASE}"  -- Change to your server URL
local POLL_INTERVAL = 3  -- seconds between heartbeats

local HttpService = game:GetService("HttpService")
local Players = game:GetService("Players")
local player = Players.LocalPlayer

local clientId = nil

-- Register with the server
local function register()
    local ok, res = pcall(function()
        local body = HttpService:JSONEncode({
            username = player.Name,
            game_name = game:GetService("MarketplaceService"):GetProductInfo(game.PlaceId).Name or "Unknown"
        })
        local response = HttpService:RequestAsync({
            Url = SERVER_URL .. "/api/register",
            Method = "POST",
            Headers = { ["Content-Type"] = "application/json" },
            Body = body
        })
        local data = HttpService:JSONDecode(response.Body)
        return data.client_id
    end)
    if ok then
        clientId = res
        print("[JoinCoord] Registered with ID: " .. clientId)
    else
        warn("[JoinCoord] Registration failed: " .. tostring(res))
    end
end

-- Find and click all GUI elements containing "Join" text
local function clickJoinButtons()
    local found = 0
    local playerGui = player:FindFirstChild("PlayerGui")
    if not playerGui then return 0 end

    local function searchGui(parent)
        for _, child in ipairs(parent:GetDescendants()) do
            if (child:IsA("TextButton") or child:IsA("TextLabel") or child:IsA("ImageButton")) then
                local text = ""
                if child:IsA("TextButton") or child:IsA("TextLabel") then
                    text = child.Text or ""
                end
                if string.lower(text):find("join") then
                    -- Try to fire click
                    if child:IsA("TextButton") or child:IsA("ImageButton") then
                        -- Fire the button's activation
                        local bindable = child:FindFirstChildOfClass("BindableEvent")
                        if child.Activated then
                            -- Use fireclick via virtual input
                            local absPos = child.AbsolutePosition
                            local absSize = child.AbsoluteSize
                            local centerX = absPos.X + absSize.X / 2
                            local centerY = absPos.Y + absSize.Y / 2

                            -- Try multiple click methods
                            pcall(function()
                                game:GetService("VirtualInputManager"):SendMouseButtonEvent(
                                    centerX, centerY, 0, true, game, 0
                                )
                                wait(0.05)
                                game:GetService("VirtualInputManager"):SendMouseButtonEvent(
                                    centerX, centerY, 0, false, game, 0
                                )
                            end)

                            found = found + 1
                            print("[JoinCoord] Clicked: " .. child:GetFullName())
                        end
                    end
                end
            end
        end
    end

    searchGui(playerGui)

    -- Also check CoreGui if accessible
    pcall(function()
        searchGui(game:GetService("CoreGui"))
    end)

    return found
end

-- Process commands from server
local function processCommands(commands)
    for _, cmd in ipairs(commands) do
        if cmd.action == "join" then
            print("[JoinCoord] Executing JOIN command...")
            local count = clickJoinButtons()
            -- Report result
            pcall(function()
                HttpService:RequestAsync({
                    Url = SERVER_URL .. "/api/result",
                    Method = "POST",
                    Headers = { ["Content-Type"] = "application/json" },
                    Body = HttpService:JSONEncode({
                        client_id = clientId,
                        success = count > 0,
                        message = count > 0
                            and ("Clicked " .. count .. " join button(s)")
                            or "No join buttons found on screen"
                    })
                })
            end)
        end
    end
end

-- Heartbeat loop
local function heartbeatLoop()
    while clientId and wait(POLL_INTERVAL) do
        local ok, res = pcall(function()
            local gameName = "Unknown"
            pcall(function()
                gameName = game:GetService("MarketplaceService"):GetProductInfo(game.PlaceId).Name
            end)

            local response = HttpService:RequestAsync({
                Url = SERVER_URL .. "/api/heartbeat",
                Method = "POST",
                Headers = { ["Content-Type"] = "application/json" },
                Body = HttpService:JSONEncode({
                    client_id = clientId,
                    username = player.Name,
                    game_name = gameName
                })
            })
            return HttpService:JSONDecode(response.Body)
        end)

        if ok and res and res.commands then
            if #res.commands > 0 then
                processCommands(res.commands)
            end
        elseif not ok then
            warn("[JoinCoord] Heartbeat failed: " .. tostring(res))
        end
    end
end

-- Disconnect on leave
game:BindToClose(function()
    if clientId then
        pcall(function()
            HttpService:RequestAsync({
                Url = SERVER_URL .. "/api/disconnect",
                Method = "POST",
                Headers = { ["Content-Type"] = "application/json" },
                Body = HttpService:JSONEncode({ client_id = clientId })
            })
        end)
    end
end)

-- Start
register()
if clientId then
    heartbeatLoop()
end`;

document.getElementById('luaScript').textContent = LUA_SCRIPT;

function copyScript() {
  navigator.clipboard.writeText(LUA_SCRIPT).then(() => {
    const btn = event.target;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy Script', 2000);
  });
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Boot
connectWS();
</script>
</body>
</html>
